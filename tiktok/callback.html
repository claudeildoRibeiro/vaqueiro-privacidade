<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vaqueiro Studio — conectando ao TikTok</title>
<style>body{font-family:system-ui,sans-serif;max-width:560px;margin:60px auto;padding:0 16px;line-height:1.6;color:#222}</style>
</head>
<body>
<h1>Conectando ao TikTok…</h1>
<p>Voltando para o painel do Vaqueiro Studio no seu computador. Se nada acontecer, deixe o painel aberto e tente de novo.</p>
<script>
  // o painel roda no PC do dono (http://localhost:4700); o TikTok só aceita redirecionar pra https
  location.replace('http://localhost:4700/tiktok/callback' + location.search);
</script>
</body>
</html>
